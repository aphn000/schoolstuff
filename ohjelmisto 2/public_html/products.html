<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width", initial-scale="1.0">
    <title>Shop of Products</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header>
    
        <div class="brand">
            <img src="shopp.png" alt="Shop logo" class="shop-logo">
            <h1>Shop of Products</h1>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="contact.html">Contacts</a>


        </nav>

    </header>

    

    <main>
        <img src="big-sale-banner-png.png" alt="banner" class="products-banner">

        <h2>Our products</h2>

        <div class="products-container">

            <div class="product-card">
                <img src="whatsapp.jpg" alt="Product 1">
                <h3>Product 1</h3>
                <p>Low quality product</p>
            </div>

            <div class="product-card">
                <img src="PearPhone3.jpg" alt="Product 2">
                <h3>Product 2</h3>
                <p>Medium quality product</p>
            </div>

            <div class="product-card">
                <img src="megaforce.jpg" alt="Product 3">
                <h3>Product 3</h3>
                <p>High quality product</p>
            </div>

        </div>
    </main>
    

</body>

</html>
